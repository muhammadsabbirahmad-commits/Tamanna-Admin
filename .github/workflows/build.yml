name: Build Tamanna Admin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed Release APK"
        required: true
        default: false
        type: boolean

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-admin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_FILE: ${{ github.workspace }}/tamanna-admin-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }

      - name: Restore fixed release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -v | grep -E "Alias name:|SHA1:|SHA256:"

      - name: Build signed Release APK
        run: gradle assembleRelease

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-admin-release-apk
          path: app/build/outputs/apk/release/app-release.apk
